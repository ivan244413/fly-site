<style>

#clog{display:flex;flex-direction:column;gap:3px;font-size:13px}
.cm{align-self:flex-start;max-width:100%;background:rgba(8,18,12,.72);border:1px solid rgba(255,255,255,.12);color:#e4ece6;border-radius:12px;padding:4px 10px;overflow-wrap:anywhere;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const WORLD=3000,C=document.getElementById('c'),X=C.getContext('2d');
let w=1,h=1,dpr=1,full=false,mx=0,my=0,toast=0,scl=.8,T=0,playing=false,room=null,iHost=false,myPeer=null,pt=0,bots=true;const G={},seenG={},ro={},seenK={},KK={},odSeen={};const cam={x:1500,y:1500};
function rs(){dpr=devicePixelRatio||1;const r=C.getBoundingClientRect();w=r.width;h=r.height;C.width=w*dpr;C.height=h*dpr}
addEventListener('resize',rs);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(rs).observe(C);
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rad=m=>4+Math.sqrt(m)*2.6;
function ovl(ra,rb,d){/* quanta parte (0-1) del cerchio B è dentro il cerchio A */if(d>=ra+rb)return 0;if(d<=Math.abs(ra-rb))return rb<=ra?1:(ra*ra)/(rb*rb);const A=Math.acos((d*d+ra*ra-rb*rb)/(2*d*ra)),B=Math.acos((d*d+rb*rb-ra*ra)/(2*d*rb));const lens=ra*ra*(A-Math.sin(2*A)/2)+rb*rb*(B-Math.sin(2*B)/2);return lens/(Math.PI*rb*rb)}
const NAMES=['Zzzap','Drosofila','Bzzt','Moscerino','Pungiglione','Ronzio','Mosca Rossa','Dottor Bzz','Frullo','Vola-Vola','Occhirossi','Ali di Seta','Fruttina','Aristotele','Gigi'];
const owners=[],cells=[];let seed=1,roomCode='',creating=false;let teams=false,tmode=false,myT=-1,KB=[0,0],lastHit=-1,over=false,t0=0;let gm=0,gmode=0,myF=-1,CCm=0,hsv=[0,0],hctl=-1,BASE=null,HILL=null,jx=0,jy=0;const CCS={},HILL_R=260,TGT=[0,30,5,60,0];const TK={};const elog=[];let BK=[0,0],BC=[0,0],ORD=[0,0],ORDP=[undefined,undefined],myOd=null,odSeq=0;
const strHash=t=>{let q=7;for(const ch of t)q=(Math.imul(q,31)+ch.charCodeAt(0))|0;return q};
const hsh=(a,b)=>{let t=(Math.imul(a,374761393)+Math.imul(b,668265263)+seed)|0;t=Math.imul(t^(t>>>13),1274126177);t=Math.imul(t^(t>>>16),2246822519);return((t^(t>>>15))>>>0)/4294967296};
const FM=[1,3,5,7],ftype=(i,v)=>{const r=hsh(i*5+3,v+7);return r<.80?0:r<.91?1:r<.97?2:3};
const foodAt=(i,v)=>{const q=nudge(20+hsh(i*3,v)*(WORLD-40),20+hsh(i*3+1,v)*(WORLD-40),10),k=ftype(i,v);return{x:q[0],y:q[1],c:Math.floor(hsh(i*3+2,v)*360),m:FM[k],k,vx:0,vy:0,i,v}};
const mkFood=()=>Array.from({length:520},(_,i)=>foodAt(i,0));
let food=mkFood();
function newCell(o,x,y,m){const c={o,x,y,m,vx:0,vy:0,bx:0,by:0,mt:0,ang:rnd(0,6.28),ph:rnd(0,6)};cells.push(c);return c}
function dropFood(b){const tot=b.m*.2;if(tot<1.5)return;const n=Math.min(10,Math.max(2,Math.round(tot/1.5))),m=tot/n,R=rad(b.m)*.6;for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(90,230);food.push({x:b.x+Math.cos(a)*R*.5,y:b.y+Math.sin(a)*R*.5,c:b.o.hue,m,e:1,vx:Math.cos(a)*v,vy:Math.sin(a)*v})}}
function spawn(o){let sx=rnd(100,WORLD-100),sy=rnd(100,WORLD-100);if(gm===2&&o.t!==undefined){sx=(o.t?2740:260)+rnd(-120,120);sy=1500+rnd(-300,300)}const q=nudge(sx,sy,30);newCell(o,q[0],q[1],10);o.dead=0;if(o===me)pw.sh=3;else if(o.bot){o.pw=o.pw||{x2:0,tb:0,sh:0,mg:0};o.pw.sh=3}}
const thue=t=>gm===4?(t?215:105):(t?215:5),tcol=t=>gm===4?(t?'#4da3ff':'#8cff3d'):(t?'#4da3ff':'#ff5a4d');
function mk(name,bot,t){const o={id:owners.length,name,bot,t,cf:-1,deaths:0,dead:0,hue:bot?20+(owners.length*17)%40:50,wx:0,wy:0};if(t!==undefined)o.hue=thue(t);owners.push(o);if(bot)o.fit=botFit(o.id);spawn(o);return o}
let me={id:-1,name:'Tu',deaths:0};
const mine=()=>cells.filter(c=>c.o===me);
function wm(){return{x:cam.x+(mx-w/2)/scl,y:cam.y+(my-h/2)/scl}}
const keys={};let kb=false;
function aim(c){if(kb)return[Math.cos(c.ang),Math.sin(c.ang)];const m=wm(),dx=m.x-c.x,dy=m.y-c.y,l=Math.hypot(dx,dy)||1;return[dx/l,dy/l]}
function nearCell(c,t){let b=null,bd=500;for(const k of cells){if(!t(k))continue;const d=Math.hypot(k.x-c.x,k.y-c.y);if(d<bd){bd=d;b=k}}return b?{dx:(b.x-c.x)/bd,dy:(b.y-c.y)/bd,p:1-bd/500}:{dx:0,dy:0,p:0}}

function applyKing(){if(!KING)return;if(KING===me){pw.sh=Math.max(pw.sh,KST.imm);flash('Sei il re! 👑 Immune '+Math.ceil(KST.imm)+'s')}else if(KING.bot&&owners.includes(KING)){KING.pw=KING.pw||{x2:0,tb:0,sh:0,mg:0};KING.pw.sh=Math.max(KING.pw.sh||0,KST.imm)}}
function setKing(o,imm){KING=o;KST.imm=imm;applyKing();if(o!==me)flash('👑 '+o.name+' è il nuovo re!')}
function elimLocal(o){o.elim=true;for(let i=cells.length-1;i>=0;i--)if(cells[i].o===o)cells.splice(i,1);if(o===me||(o.bot&&owners.includes(o)))o.dead=1e9;if(o===me)flash('💥 Sei esploso! Guarda come finisce')}
function boomAt(o){const c=bigCell(o);if(c)boomFx.push({x:c.x,y:c.y,t:T})}
function roundLocal(dt){
  if(gm===5&&KING&&KING===me)me.pt=(me.pt||0)+dt;
  if(gm===5&&KING&&KING.bot&&owners.includes(KING))KING.pt=(KING.pt||0)+dt;
  if(!isAuth()&&KST.imm>0)KST.imm-=dt;
  const sid=selfId();if(gm===6&&sid&&ELIMS.has(sid)&&!me.elim)elimLocal(me)}
function roundPub(){const p={};if(gm===5&&KING)p.kg=[sidOf(KING),Math.round(KST.imm*10)/10];if(gm===6){p.bm=BOMBS.map(b=>[sidOf(b.o),Math.round(b.left*10)/10]);p.el=[...ELIMS].slice(0,40)}return p}
function roundRecv(d,peer){HP=peer;
  if(gm===5&&Array.isArray(d.kg)){const id=String(d.kg[0]);KST.imm=+d.kg[1]||0;KING=oById(id);if(kgSeen!==id){kgSeen=id;if(KING===me)applyKing()}}
  if(gm===6){
    if(Array.isArray(d.bm)){BMS=d.bm.slice(0,2).map(q=>({sid:String(q[0]),left:+q[1]||0,at:performance.now()}));const mineNow=BMS.some(q=>q.sid===selfId());if(mineNow&&!bmMine)flash('💣 Hai la bomba! Tocca qualcuno per passarla');bmMine=mineNow}
    if(Array.isArray(d.el))for(const id0 of d.el.slice(0,40)){const id=String(id0);if(!ELIMS.has(id)){ELIMS.add(id);const o=oById(id);if(o){boomAt(o);if(o!==me)flash('💥 '+o.name+' è esploso!')}}}}}
function bombList(){return isAuth()?BOMBS.map(b=>({o:b.o,left:b.left})):BMS.map(q=>({o:oById(q.sid),left:q.left-(performance.now()-q.at)/1000})).filter(x=>x.o)}
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function roundTick(dt){
  const el=(performance.now()-t0)/1000,g=groups(),L=[...g.keys()].filter(o=>!ELIMS.has(sidOf(o)));
  if(gm===5){
    if(KING&&!g.has(KING))KING=null;
    if(!KING){if(el>1.5&&L.length)setKing(L[Math.floor(Math.random()*L.length)],5);return}
    const k=sidOf(KING);if(k)KS[k]=(KS[k]||0)+dt;
    if(KST.imm>0){KST.imm-=dt;return}
    for(const o of L){if(o!==KING&&touchG(g,o,KING)){setKing(o,5);break}}
    return}
  if(!rs0.go){if(el>3&&L.length>=2){rs0.go=1;const n=Math.min(2,L.length-1),P=shuf(L.slice());for(let i=0;i<n;i++)BOMBS.push({o:P[i],left:20,cool:1.2,prev:null,pc:0});flash('💣 Via! Passa la bomba toccando gli altri')}return}
  const hold=o=>BOMBS.some(b=>b.o===o),free=()=>L.filter(o=>!hold(o));
  for(const b of BOMBS){b.left-=dt;b.cool-=dt;b.pc-=dt;if(!L.includes(b.o)){const f=free();if(f.length){b.o=f[Math.floor(Math.random()*f.length)];b.cool=1.2}}}
  for(const b of BOMBS){if(b.cool>0)continue;for(const o of free()){if(o===b.prev&&b.pc>0)continue;if(touchG(g,b.o,o)){b.prev=b.o;b.pc=3;b.o=o;b.cool=1.2;if(o===me)flash('💣 Hai la bomba! Tocca qualcuno per passarla');break}}}
  for(const b of BOMBS.slice()){if(b.left>0)continue;const o=b.o;ELIMS.add(sidOf(o));boomAt(o);elimLocal(o);for(let i=cells.length-1;i>=0;i--)if(cells[i].o===o)cells.splice(i,1);BOMBS.splice(BOMBS.indexOf(b),1);if(o!==me)flash('💥 '+o.name+' è esploso!');
    const A=L.filter(q=>q!==o),need=Math.min(2,A.length-1),f=A.filter(q=>!hold(q));while(BOMBS.length<need&&f.length){const q=f.splice(Math.floor(Math.random()*f.length),1)[0];BOMBS.push({o:q,left:20,cool:1.2,prev:null,pc:0})}
    if(A.length<=1){const w=A[0]||null,r={w:-1,g:6,wn:w?w.name:'',wm:0,k:[0,0],m:[0,0]};finish(r);if(room)room.presence({res:r}).catch(()=>{});return}}
}
function endKing(){const E=Object.keys(KS).map(k=>({o:oById(k),s:KS[k]})).filter(x=>x.o).sort((a,b)=>b.s-a.s);const w=E[0],r={w:-1,g:5,wn:w?w.o.name:'',ws:w?Math.round(w.s):0,tp:E.slice(0,3).map(x=>x.o.name+' '+Math.round(x.s)+'s').join(' · '),k:[0,0],m:[0,0]};finish(r);if(room)room.presence({res:r}).catch(()=>{})}

function doorWay(c,x,y){const dir=Math.hypot(x-c.x,y-c.y);let best=null,bv=dir-60;for(let i=0;i<4;i++){const d=DOORS[i],e=DOORS[(i+2)%4],v=Math.hypot(d[0]-c.x,d[1]-c.y)+Math.hypot(x-e[0],y-e[1]);if(v<bv){bv=v;best=d}}return best}
function goTo(c,x,y){const w=doorWay(c,x,y),tx=w?w[0]:x,ty=w?w[1]:y,l=Math.hypot(tx-c.x,ty-c.y)||1;return[(tx-c.x)/l,(ty-c.y)/l,!!w]}
function nearestCell(c,f){let b=null,bd=1e9;for(const k of cells){if(!f(k))continue;const d=Math.hypot(k.x-c.x,k.y-c.y);if(d<bd){bd=d;b=k}}return b?{k:b,d:bd}:null}
function fleeDoor(c,k){let best=null,bd=420;for(let i=0;i<4;i++){const d=DOORS[i],e=DOORS[(i+2)%4],dd=Math.hypot(d[0]-c.x,d[1]-c.y);if(dd<bd&&Math.hypot(k.x-d[0],k.y-d[1])>dd+80&&Math.hypot(k.x-e[0],k.y-e[1])>650){bd=dd;best=d}}return best}
function roleAI(c,o){
  const al=k=>!ELIMS.has(sidOf(k.o)),nrm=(x,y)=>{const l=Math.hypot(x,y)||1;return[x/l,y/l]};
  const W=()=>nrm(o.wx,o.wy);let out,dr=false;
  if(gm===5){
    if(!KING)out=[...W(),false];
    else if(o===KING){const th=nearCell(c,k=>k.o!==o),nk=nearestCell(c,k=>k.o!==o),fd=nk&&nk.d<420?fleeDoor(c,nk.k):null;if(fd){dr=true;const l=Math.hypot(fd[0]-c.x,fd[1]-c.y)||1;out=[(fd[0]-c.x)/l,(fd[1]-c.y)/l,true]}else out=th.p>0?[-th.dx,-th.dy,th.p>.35]:[...W(),false]}
    else{let b=null,bd=1e9;for(const k of cells)if(k.o===KING){const d=Math.hypot(k.x-c.x,k.y-c.y);if(d<bd){bd=d;b=k}}
      if(!b)out=[...W(),false];else{const g=goTo(c,b.x,b.y);dr=g[2];out=KST.imm>.3?(bd>260?[g[0],g[1],g[2]||bd>700]:[...W(),false]):[g[0],g[1],g[2]||bd<500]}}}
  else{
    const H=q=>BOMBS.some(b=>b.o===q);
    if(H(o)){const tg=nearestCell(c,k=>k.o!==o&&al(k)&&!H(k.o));if(tg){const g=goTo(c,tg.k.x,tg.k.y);dr=g[2];out=[g[0],g[1],true]}else out=[...W(),false]}
    else{const th=nearCell(c,k=>H(k.o)),nk=nearestCell(c,k=>H(k.o)),fd=nk&&nk.d<420?fleeDoor(c,nk.k):null;if(fd){dr=true;const l=Math.hypot(fd[0]-c.x,fd[1]-c.y)||1;out=[(fd[0]-c.x)/l,(fd[1]-c.y)/l,true]}else out=th.p>0?[-th.dx,-th.dy,th.p>.45]:[...W(),false]}}
  let x=out[0],y=out[1];if(!dr){if(c.x<220)x+=1.2;if(c.x>WORLD-220)x-=1.2;if(c.y<220)y+=1.2;if(c.y>WORLD-220)y-=1.2}
  const n=nrm(x,y);return[n[0],n[1],out[2]]}
function roundHud(){const tm=l=>Math.floor(l/60)+':'+String(Math.floor(l%60)).padStart(2,'0');
  if(gm===5){const l=Math.max(0,180-(performance.now()-t0)/1000);return '👑 '+(KING?KING.name:'…')+(KST.imm>.05?' (immune '+Math.ceil(KST.imm)+'s)':'')+' · ⏱ '+tm(l)+(KING===me?' · sei il re!':'')+' · tuo tempo da re: '+Math.floor(me.pt||0)+'s'}
  const n=new Set(cells.map(c=>c.o).filter(o=>!ELIMS.has(sidOf(o)))).size,B=bombList();
  return '💣 In gara: '+n+(B.length?' · '+B.map(x=>x.o.name.slice(0,8)+' '+Math.max(0,Math.ceil(x.left))+'s').join(' · '):'')+(B.some(x=>x.o===me)?' · HAI LA BOMBA!':'')+(me.elim?' · sei fuori':'')}
function drawRoleMarks(s){if(gm<5)return;const X=X0;
  if(gm===5&&KING){const c=bigCell(KING);if(c){const r=rad(c.m),sz=Math.max(r*1.5,22/s);X.save();
    if(KST.imm>0){X.strokeStyle='rgba(255,215,90,.95)';X.lineWidth=3/s;X.setLineDash([10/s,8/s]);X.lineDashOffset=-T*30;X.beginPath();X.arc(c.x,c.y,r*1.5,0,6.28);X.stroke();X.setLineDash([])}
    X.font=sz+'px serif';X.textAlign='center';X.textBaseline='middle';X.fillText('👑',c.x,c.y-r*2.45-Math.sin(T*3)*r*.1);X.restore()}}
  if(gm===6)for(const b of bombList()){const c=bigCell(b.o);if(!c)continue;const r=rad(c.m),left=Math.max(0,b.left),hot=left<5,pul=hot?(.5+.5*Math.sin(T*14)):.4;
    X.save();X.strokeStyle='rgba(255,70,50,'+(.45+pul*.5)+')';X.lineWidth=(hot?5:3)/s;X.beginPath();X.arc(c.x,c.y,r*1.45+pul*r*.1,0,6.28);X.stroke();
    const bx=c.x,by=c.y-r*1.95,br=Math.max(r*.55,13/s);
    X.fillStyle='#14171a';X.strokeStyle='#59636a';X.lineWidth=2/s;X.beginPath();X.arc(bx,by,br,0,6.28);X.fill();X.stroke();
    X.strokeStyle='#caa46a';X.lineWidth=Math.max(br*.14,1.5/s);X.beginPath();X.moveTo(bx+br*.3,by-br*.85);X.quadraticCurveTo(bx+br*.9,by-br*1.4,bx+br*1.15,by-br*1.1);X.stroke();
    X.fillStyle=hot&&Math.sin(T*14)>0?'#fff176':'#ff9f43';X.beginPath();X.arc(bx+br*1.15,by-br*1.1,br*(.2+(hot?.1:0)),0,6.28);X.fill();
    X.fillStyle='#ff6a5a';X.font='800 '+br*.95+'px system-ui,sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText(Math.ceil(left),bx,by+br*.05);X.restore()}
  for(let i=boomFx.length-1;i>=0;i--){const f=boomFx[i],k=(T-f.t)/.8;if(k>=1){boomFx.splice(i,1);continue}
    X.save();X.translate(f.x,f.y);X.strokeStyle='rgba(255,170,60,'+(1-k)+')';X.lineWidth=Math.max(8*(1-k),2/s);X.beginPath();X.arc(0,0,40+k*220,0,6.28);X.stroke();
    X.fillStyle='rgba(255,90,40,'+(1-k)*.9+')';for(let j=0;j<10;j++){const a=j*.628+k,rr=30+k*190;X.beginPath();X.arc(Math.cos(a)*rr,Math.sin(a)*rr,10*(1-k)+2,0,6.28);X.fill()}X.restore()}}
const DUR=()=>gm===4?60:teams?180:3000;
function teamTick(){
  if(over)return;const el=(performance.now()-t0)/1000,auth=iHost||!room;
  if(gm>=5){if(auth&&gm===5&&el>=180)endKing();return}
  if(!auth&&el<DUR()+10)return;
  if(!teams){
    if(el<DUR())return;
    const tot=new Map();for(const c of cells)tot.set(c.o,(tot.get(c.o)||0)+c.m);let bo=null,bm=0;for(const[o,v] of tot)if(v>bm){bm=v;bo=o}
    const r={w:-1,g:0,wn:bo?bo.name:'',wm:Math.round(bm),k:[0,0],m:[0,0]};finish(r);if(auth&&room)room.presence({res:r}).catch(()=>{});return}
  if(gm===4){
    const inf=gscore(0),san=gscore(1);let w=null;
    if(san===0&&inf>1&&el>2)w=0;else if(el>=DUR())w=san>0?1:0;
    if(w===null)return;
    const r={w,g:4,k:[inf,san],m:[0,0]};finish(r);if(auth&&room)room.presence({res:r}).catch(()=>{});return}
  const s0=gscore(0),s1=gscore(1);let w=null;
  if(s0>=TGT[gm]||s1>=TGT[gm])w=s0===s1?-1:s0>s1?0:1;
  else if(el>=DUR()){let a=teamMass(0),b=teamMass(1);if(gm>1&&s0!==s1){a=s0;b=s1}w=Math.abs(a-b)<.5?-1:a>b?0:1}
  if(w===null)return;
  const r={w,g:gm,k:[Math.round(s0),Math.round(s1)],m:[Math.round(teamMass(0)),Math.round(teamMass(1))]};finish(r);if(auth&&room)room.presence({res:r}).catch(()=>{});
}
function teamHud(){const e=$('tm');e.hidden=over;if(e.hidden)return;if(gm>=5){e.textContent=roundHud();return}const l=Math.max(0,DUR()-Math.floor((performance.now()-t0)/1000)),tm=Math.floor(l/60)+':'+String(l%60).padStart(2,'0');if(!teams){e.textContent='⏱ '+tm+' · vince il più grande';return}e.innerHTML=`<span style="color:${gm===4?'#8cff3d':'#ff6b5e'}">${gm===4?'Infetti':'Rossa'} ${gs(0)}</span> <b>${tm}</b> <span style="color:#6db4ff">${gs(1)} ${gm===4?'Sani':'Blu'}</span> · ${TGX[gm]}`}
$('er').onclick=()=>location.reload();
let last=performance.now(),lt=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;T+=dt;if(playing&&!over){step(dt);modeTick(dt);teamTick();pt+=dt;if(room&&pt>.08){pt=0;pub()}}draw();if(!$('wd').hidden)drawPreview();lt+=dt;if(lt>.25){lt=0;if(playing)lists()}requestAnimationFrame(loop)}
rs();mx=w/2;my=h/2;requestAnimationFrame(loop);
</script>
